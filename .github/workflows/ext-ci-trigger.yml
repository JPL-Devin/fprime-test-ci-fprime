name: ext-ci-trigger

# Deliberately trivial. This workflow runs under the repository's normal `pull_request`
# rules (including "require approval for workflows from forks"), and its completion is what
# starts the privileged orchestrator in ext-ci.yml via `workflow_run`. It must never need
# secrets and must never produce anything the orchestrator trusts.
on:
  pull_request:
    branches: [ main, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions: {}

jobs:
  approved:
    name: "Gate passed"
    runs-on: ubuntu-24.04
    steps:
      - run: echo "pull_request workflow ran for ${GITHUB_SHA}; ext-ci may proceed"
